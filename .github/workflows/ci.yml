name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Check Node pins match .nvmrc
        run: |
          node_major="$(tr -d '[:space:]' < .nvmrc)"
          grep -qx "FROM node:${node_major}-slim" Containerfile \
            || { echo "Containerfile base image does not match .nvmrc (${node_major})"; exit 1; }
          grep -qE "^[[:space:]]*NODE_VERSION[[:space:]]*=[[:space:]]*\"${node_major}\"[[:space:]]*$" netlify.toml \
            || { echo "netlify.toml NODE_VERSION does not match .nvmrc (${node_major})"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run typecheck
        run: npm run check

      - name: Run tests
        run: npm run test:run

      - name: Run build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
